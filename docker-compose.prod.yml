# Entorno de PRODUCCIÓN. Gunicorn detrás de Nginx con TLS, límites de
# recursos conservadores (pensados para un VPS de 2-4 GB RAM — ajusta
# según las specs reales de tu servidor). Sin puertos de DB/Redis
# expuestos al host.
#
# Uso:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/prod.txt
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_MIGRATIONS: "true"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/mediafiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/prod.txt
    command: celery -A config worker -l info --concurrency=2
    restart: unless-stopped
    env_file: .env
    depends_on:
      - web
      - redis
    deploy:
      resources:
        limits:
          memory: 384M

  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/prod.txt
    command: celery -A config beat -l info
    restart: unless-stopped
    env_file: .env
    depends_on:
      - web
      - redis
    deploy:
      resources:
        limits:
          memory: 128M

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      # Determina qué certificado carga nginx (ver docker/nginx/default.conf.template).
      # Cuando compres un dominio propio, solo cambias este valor.
      PRIMARY_DOMAIN: ${CERTBOT_DOMINIOS_PRIMARIO}
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/mediafiles:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Renovación automática cada 12h (no-op si aún no toca renovar)
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h; done"

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - ./scripts/backup_db.sh:/backup_db.sh:ro
      - backups_data:/backups
    env_file: .env
    entrypoint: >
      /bin/sh -c "chmod +x /backup_db.sh &&
      while :; do /backup_db.sh; sleep 86400; done"
    depends_on:
      - db

volumes:
  postgres_data:
  static_data:
  media_data:
  certbot_conf:
  certbot_www:
  backups_data:
