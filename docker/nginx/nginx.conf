# OBSOLETO: reemplazado por default.conf.template (procesado
# automáticamente por la imagen oficial de nginx con envsubst, ver
# docker-compose.prod.yml). Se deja este archivo solo como referencia
# de la versión sin templating; no se monta en ningún contenedor.
#
# Proxy inverso para producción. TLS terminado aquí (certbot monta los
# certificados). Ajusta server_name cuando tengas dominio real.

upstream django_app {
    server web:8000;
}

# Redirige todo HTTP a HTTPS
server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name _;  # TODO: reemplazar por tu dominio real

    ssl_certificate     /etc/letsencrypt/live/TU_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TU_DOMINIO/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Cabeceras de seguridad (defensa adicional a las de Django)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 10M;

    location /static/ {
        alias /app/staticfiles/;
    }
    location /media/ {
        alias /app/mediafiles/;
    }

    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
