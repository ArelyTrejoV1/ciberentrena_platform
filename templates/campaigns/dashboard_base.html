<!doctype html>
<html lang="es-mx">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Dashboard — CiberEntrena{% endblock %}</title>
  {% include "_estilos.html" %}
  <style>
    header.ce-header { display: flex; justify-content: space-between; align-items: center;
                        padding: 20px 32px; border-bottom: 2px solid var(--ce-negro); }
    header.ce-header a.ce-nav__enlace { color: var(--ce-negro); text-decoration: none;
                                         font-size: 13px; font-weight: 600; margin-left: 26px;
                                         text-transform: uppercase; letter-spacing: 0.06em;
                                         padding-bottom: 3px; border-bottom: 2px solid transparent; }
    header.ce-header a.ce-nav__enlace:hover,
    header.ce-header a.ce-nav__enlace.activa { border-bottom-color: var(--ce-negro); }
    main.ce-main { max-width: 1040px; margin: 0 auto; padding: 32px 32px 64px; }
    main.ce-main h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; margin: 0 0 20px; }
  </style>
</head>
<body class="ce">
  <header class="ce-header">
    <a href="{% url 'dashboard:lista' %}" style="text-decoration:none; color:inherit;">
      {% include "_logo.html" %}
    </a>
    <nav>
      <a class="ce-nav__enlace {% block nav_campanas %}{% endblock %}" href="{% url 'dashboard:lista' %}">Campañas</a>
      <a class="ce-nav__enlace {% block nav_comparativo %}{% endblock %}" href="{% url 'dashboard:comparativo' %}">Antes / después</a>
    </nav>
  </header>
  <main class="ce-main">
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
